name: Maester Daily Tests

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'  # Tous les jours à minuit
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  run-maester-tests:
    name: Run Maester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Run Maester action
        uses: maester365/maester@main
        with:
          client_id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          include_public_tests: true
          include_exchange: true
          step_summary: true
          artifact_upload: true
          install_prerelease: false
          disable_telemetry: false

      - name: Install Maester for Teams notification
        shell: pwsh
        run: |
          Install-Module Maester -Force -Scope CurrentUser
          Import-Module Maester
          
          # Charge les résultats du dernier test (produits par l'action précédente)
          $json = Get-Content ./maester-output/results.json | ConvertFrom-Json

          Send-MtTeamsMessage `
            -MaesterResults $json `
            -TeamChannelWebhookUri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Subject "Résultats Maester - GitHub Actions"
