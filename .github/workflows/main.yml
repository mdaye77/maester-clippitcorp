name: Test Envoi Teams depuis fichier JSON local

on:
  workflow_dispatch:  # Lancer manuellement

permissions:
  contents: read

jobs:
  send-results-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Maester module
        shell: pwsh
        run: |
          Install-Module Maester -Force -Scope CurrentUser
          Import-Module Maester

      - name: Lire le fichier JSON local et envoyer à Teams
        shell: pwsh
        run: |
          # Lecture du fichier JSON qui se trouve dans .github/workflows/test-results.json
          $results = Get-Content .github/workflows/test-results.json | ConvertFrom-Json

          # Envoi du résumé à Teams
          Send-MtTeamsMessage `
            -MaesterResults $results `
            -TeamId "${{ secrets.TEAMS_TEAM_ID }}" `
            -TeamChannelId "${{ secrets.TEAMS_CHANNEL_ID }}" `
            -Subject "🔁 Résultats des tests Maester (GitHub Actions)"
