name: Maester Daily Tests

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * *'  # Tous les jours à minuit
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  run-maester-tests:
    name: Run Maester Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Maester and send to Teams
        shell: pwsh
        run: |
          Install-Module Maester -Force -Scope CurrentUser
          Import-Module Maester

          $results = Invoke-Maester `
            -TeamChannelWebhookUri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -include_public_tests `
            -include_exchange `
            -step_summary `
            -artifact_upload `
            -disable_telemetry:$false `
            -PassThru

          Send-MtTeamsMessage `
            -MaesterResults $results `
            -TeamChannelWebhookUri "${{ secrets.TEAMS_WEBHOOK_URL }}" `
            -Subject "Résultats des tests Maester (GitHub Actions)"
